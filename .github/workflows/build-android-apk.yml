name: Build Android APK (Android 14 / 15 / 16 Compatible)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (required for AGP 8.7+ / Android 15 SDK 35)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 & Build Tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm packages & Build web bundle
        run: |
          npm install
          npm run build

      - name: Setup Capacitor 7 & Generate Android Project
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          npx cap add android
          cp android-config/variables.gradle android/variables.gradle
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
              cp public/pwa-maskable-512x512.png "$dir/ic_launcher_round.png" || true
              cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rajal-Public-School-Android15-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
